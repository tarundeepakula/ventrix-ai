<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Ventrix AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --blue:#226db4;--blue-dark:#185a97;--blue-light:#eaf3fb;
  --green:#25d366;--green-dark:#128c7e;--green-deep:#075e54;
  --ink:#1b2a3a;--text:#4a5a6a;--muted:#68798a;
  --bg:#f5f7fa;--white:#fff;--border:#dfe5ec;--shadow:0 8px 24px rgba(27,42,58,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6}
a{text-decoration:none;color:inherit}


@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.95)}100%{opacity:1;transform:none}}
@keyframes typing{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(37,211,102,.3)}70%{box-shadow:0 0 0 14px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}


.page{display:grid;grid-template-columns:1fr;min-height:100vh}


/* LEFT VISUAL */
.visual{
  position:relative;overflow:hidden;display:none;
  background:linear-gradient(150deg,#075e54,#128c7e 55%,#25d366);
  color:#fff;padding:45px 35px;align-items:center;justify-content:center
}
.visual::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.1);filter:blur(55px);top:-70px;right:-50px;animation:float 8s ease-in-out infinite}
.visual::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);filter:blur(45px);bottom:-60px;left:-40px;animation:float 10s ease-in-out infinite reverse}


.visual-inner{position:relative;z-index:2;max-width:380px;width:100%}
.visual h2{color:#fff;font-size:clamp(21px,2.6vw,27px);line-height:1.25;margin-bottom:10px}
.visual p{color:rgba(255,255,255,.85);font-size:13.5px;margin-bottom:24px}


.phone{background:#fff;border-radius:22px;padding:15px;box-shadow:0 25px 60px rgba(0,0,0,.22);animation:float 6s ease-in-out infinite}
.phone-header{display:flex;align-items:center;gap:10px;background:var(--green-deep);color:#fff;padding:11px 13px;border-radius:14px;margin-bottom:12px}
.phone-avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--green-deep);display:grid;place-items:center;font-weight:800;font-size:13px}
.phone-header strong{display:block;font-size:12px}
.phone-header span{font-size:9px;opacity:.85}
.chat{display:flex;flex-direction:column;gap:9px}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:12px;animation:popIn .6s ease both}
.in{background:#f1f5f9;color:var(--text);align-self:flex-start;border-bottom-left-radius:5px}
.out{background:#dcf8c6;color:#075e54;align-self:flex-end;border-bottom-right-radius:5px}
.typing{display:flex;gap:5px;align-self:flex-start;background:#f1f5f9;padding:10px 13px;border-radius:14px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typing 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}


.float-badge{
  position:absolute;display:flex;gap:9px;align-items:center;background:#fff;color:var(--ink);
  padding:10px 14px;border-radius:13px;box-shadow:0 15px 35px rgba(0,0,0,.16);font-size:11.5px;font-weight:700;
  animation:float 5s ease-in-out infinite
}
.float-badge i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:12px}
.fb1{top:10%;right:5%}.fb1 i{background:var(--blue)}
.fb2{bottom:12%;left:4%;animation-delay:1s}.fb2 i{background:var(--green-dark)}


/* RIGHT FORM */
.form-side{display:grid;place-items:center;padding:35px 18px;background:var(--bg)}
.login-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:30px 28px;box-shadow:var(--shadow);animation:fadeUp .6s ease}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo-mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--green-deep),var(--green));font-size:17px;animation:pulseRing 2.5s infinite}
.brand strong{display:block;color:var(--ink);font-size:15px}
.brand span{display:block;color:var(--muted);font-size:9px}
.brand img{display:block;height:52px;width:auto;max-width:100%}


.back-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:9px;
  background:var(--bg);color:var(--ink);
  font-size:12px;font-weight:700;
  border:1px solid var(--border);
  transition:.2s;margin-bottom:18px
}
.back-btn:hover{background:var(--blue-light);color:var(--blue);transform:translateX(-3px)}


h1{color:var(--ink);font-size:22px;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin:12px 0 6px}
.input-box{position:relative}
input{width:100%;padding:12px 44px 12px 14px;border:1px solid var(--border);border-radius:9px;font-size:13.5px;outline:none;transition:.2s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(34,109,180,.12)}
.eye-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:var(--muted);font-size:14px;cursor:pointer;border-radius:8px}
.eye-btn:hover{color:var(--blue);background:var(--blue-light)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;margin-top:20px;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;border:0;cursor:pointer;transition:.2s}
.btn:hover{background:var(--blue-dark)}
.small{text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px}
.small a{color:var(--blue);font-weight:700}
.forgot-row{text-align:right;margin-top:8px}
.forgot-row a{font-size:12px;color:var(--blue);font-weight:700}
.forgot-row a:hover{text-decoration:underline}

/* FORGOT PASSWORD SECTION */
#forgotSection{display:none}
.success-box{display:none;margin-top:14px;background:#e7f9ef;border:1px solid rgba(37,211,102,.35);color:var(--green-dark);padding:12px 14px;border-radius:10px;font-size:12.5px;font-weight:600}

.error-box{display:none;margin-top:14px;background:#fef3f2;border:1px solid #fecdca;color:#b42318;padding:12px 14px;border-radius:10px;font-size:12.5px;font-weight:600}

/* RESPONSIVE */
@media(min-width:980px){
  .page{grid-template-columns:1.05fr 1fr}
  .visual{display:flex}
}
@media(max-width:979px){
  .form-side{padding:45px 18px}
}
</style>
</head>
<body>


<div class="page">


  <!-- ANIMATED VISUAL -->
  <div class="visual">
    <div class="visual-inner">
      <h2>Set a new password</h2>
      <p>Choose a new password to get back into your dashboard.</p>


      <div class="phone">
        <div class="phone-header">
          <div class="phone-avatar">V</div>
          <div>
            <strong>Ventrix AI Assistant</strong>
            <span>Online</span>
          </div>
        </div>


        <div class="chat">
          <div class="msg in" style="animation-delay:.2s">Hi! What is the price?</div>
          <div class="msg out" style="animation-delay:.9s">Our plan is ₹499 per month.</div>
          <div class="typing" style="animation-delay:1.6s">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>


    <div class="float-badge fb1">
      <i class="fas fa-paper-plane"></i> Campaign Sent
    </div>


    <div class="float-badge fb2">
      <i class="fas fa-bullseye"></i> New Lead
    </div>
  </div>


  <!-- LOGIN FORM -->
  <div class="form-side">
    <div class="login-card">
      <a class="brand" href="index.html"><img src="logo.png" alt="Ventrix AI"></a>


      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
      </a>


      <h1>Choose a new password</h1>
      <p class="sub">Enter a new password for your Ventrix AI account.</p>

      <form id="newPasswordForm">
        <label for="password">New password</label>
        <div class="input-box">
          <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
          <button type="button" class="eye-btn" onclick="togglePassword()">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>

        <label for="password2">Confirm new password</label>
        <input type="password" id="password2" placeholder="Type it again" autocomplete="new-password" minlength="8" required>

        <div class="error-box" id="resetError"></div>
        <div class="success-box" id="resetSuccess"></div>

        <button class="btn" type="submit" id="saveBtn">
          <i class="fas fa-lock"></i> Save New Password
        </button>
      </form>

      <p class="small">
        Remembered it? <a href="login.html">Back to Login</a>
      </p>


    </div>
  </div>


</div>


<script src="js/api.js"></script>
<script>
function togglePassword(){
  const password=document.getElementById('password');
  const icon=document.getElementById('eyeIcon');
  const show = password.type==='password';
  password.type = show ? 'text' : 'password';
  icon.classList.toggle('fa-eye', !show);
  icon.classList.toggle('fa-eye-slash', show);
}

const token = new URLSearchParams(window.location.search).get('token');
const errorBox = document.getElementById('resetError');
const successBox = document.getElementById('resetSuccess');

function showError(message){
  errorBox.textContent = message;
  errorBox.style.display = message ? 'block' : 'none';
}

if (!token) {
  showError('This reset link is incomplete. Please request a new one from the login page.');
  document.getElementById('saveBtn').disabled = true;
}

document.getElementById('newPasswordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  if (password !== document.getElementById('password2').value) {
    showError('The two passwords do not match.');
    return;
  }
  const btn = document.getElementById('saveBtn');
  const original = btn.innerHTML;
  showError('');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
  try {
    const res = await api('/auth/reset-password', { method: 'POST', body: { token, password } });
    successBox.textContent = res.message + ' Taking you to login…';
    successBox.style.display = 'block';
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.innerHTML = original;
  }
});
</script>


</body>
</html>
